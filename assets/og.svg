<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143a7e"/>
      <stop offset="1" stop-color="#0a1f45"/>
    </linearGradient>
    <linearGradient id="tileDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA6FF"/>
      <stop offset="1" stop-color="#1B54D8"/>
    </linearGradient>
    <linearGradient id="tileLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9D0FF"/>
      <stop offset="1" stop-color="#5B9BF5"/>
    </linearGradient>
    <linearGradient id="tileMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FB8FF"/>
      <stop offset="1" stop-color="#2E71E5"/>
    </linearGradient>
    <linearGradient id="tileFound" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 배경에 은은한 도감 칸 -->
  <rect x="-60" y="470" width="220" height="220" rx="56" fill="rgba(90,150,255,0.08)"/>
  <rect x="190" y="540" width="160" height="160" rx="44" fill="rgba(90,150,255,0.06)"/>
  <rect x="1040" y="-80" width="240" height="240" rx="60" fill="rgba(90,150,255,0.07)"/>

  <!-- 텍스트 -->
  <text x="84" y="318" font-family="'Apple SD Gothic Neo', 'Pretendard', 'Helvetica Neue', Arial, sans-serif" font-size="124" font-weight="800" fill="#ffffff" letter-spacing="-3">유형도감</text>
  <text x="88" y="386" font-family="'Apple SD Gothic Neo', 'Pretendard', sans-serif" font-size="38" font-weight="600" fill="#c9d7f0">나를 설명하는 모든 유형, 한 곳에</text>
  <rect x="88" y="416" width="66" height="6" rx="3" fill="#3b82f6"/>
  <text x="88" y="482" font-family="'Apple SD Gothic Neo', 'Pretendard', sans-serif" font-size="27" font-weight="500" fill="#9fb2d6">MBTI 유형 검사 · 진짜 MBTI 찾기 · 에겐·테토 기질 테스트</text>
  <text x="88" y="520" font-family="'Apple SD Gothic Neo', 'Pretendard', sans-serif" font-size="27" font-weight="500" fill="#9fb2d6">otype 5축 성격 검사까지, 내 유형을 도감처럼 모아 보세요.</text>

  <!-- 로고 마크 -->
  <g transform="translate(780,120) scale(3.9)">
    <rect x="8" y="8" width="39" height="39" rx="11" fill="url(#tileDeep)"/>
    <rect x="53" y="8" width="39" height="39" rx="11" fill="url(#tileLight)"/>
    <rect x="8" y="53" width="39" height="39" rx="11" fill="url(#tileMid)"/>
    <rect x="53" y="53" width="39" height="39" rx="11" fill="url(#tileFound)"/>
  </g>
</svg>
