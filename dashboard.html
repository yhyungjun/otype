      </p>

        <p>공유 <strong>링크</strong> 또는 <strong>코드</strong>를 붙여넣어 주세요. (대시보드·페이지 주소는 추가되지 않아요.)</p>
        <ul>
          <li>링크 예시 &nbsp;<code>https://…/share.html?id=3bb145fc-…</code></li>
