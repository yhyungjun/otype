<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>OCEAN 어드민 · 검사 결과</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .admin-wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; }
    .admin-head { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
    .admin-head img { width: 30px; height: 30px; }
    .admin-head h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
    .admin-head .count { margin-left: auto; font-size: 0.85rem; color: var(--muted); font-weight: 700; }
    .gate { max-width: 400px; margin: 60px auto 0; text-align: center; }
    .gate .name-input { text-align: left; }
    .gate .btn-lg { width: 100%; margin-top: 14px; }
    .admin-status { text-align: center; color: var(--muted); padding: 40px 0; }
    .logout { font-size: 0.82rem; color: var(--primary-dark); background: none; border: none; cursor: pointer; font-weight: 700; }
    /* 결과 상세 */
    .d-toggle { margin-top: 12px; font-size: 0.82rem; font-weight: 700; color: var(--primary-dark); background: none; border: none; cursor: pointer; padding: 4px 0; }
    .rr-detail { margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
    .d-meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
    .d-section-title { font-size: 0.78rem; font-weight: 800; color: var(--text); margin: 16px 0 10px; }
    .d-bar { margin-bottom: 11px; }
    .d-bar-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.84rem; font-weight: 700; margin-bottom: 5px; gap: 8px; }
    .d-bar-top em { font-style: normal; color: var(--muted); font-size: 0.76rem; font-weight: 500; margin-left: 4px; }
    .d-bar-val { color: var(--text); flex-shrink: 0; }
    .d-track { height: 7px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .d-track span { display: block; height: 100%; border-radius: 999px; }
    .d-ans { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    @media (max-width: 560px) { .d-ans { grid-template-columns: repeat(5, 1fr); } }
    .d-ans-cell { font-size: 0.72rem; font-weight: 700; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 2px; color: #374151; }
    .d-ans-cell b { display: block; font-size: 0.58rem; color: var(--muted); font-weight: 700; margin-bottom: 1px; }
    .d-none { font-size: 0.82rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <!-- 로그인 게이트 -->
    <section id="gate" class="gate">
      <img src="../assets/logo-mark.svg" alt="" width="44" height="44" style="margin-bottom:14px" />
      <h1 class="name-title">어드민 로그인</h1>
      <p class="name-sub">검사 결과를 보려면 관리자 비밀번호를 입력하세요.</p>
      <input id="pw" class="name-input" type="password" placeholder="관리자 비밀번호" autocomplete="current-password" />
      <p class="name-error" id="err"></p>
      <button class="btn btn-primary btn-lg" id="login">로그인</button>
    </section>

    <!-- 결과 -->
    <section id="panel" style="display:none">
      <div class="admin-head">
        <img src="../assets/logo-mark.svg" alt="" />
        <h1>검사 결과</h1>
        <span class="count" id="count"></span>
      </div>
      <div style="text-align:right;margin-bottom:14px"><button class="logout" id="logout">로그아웃</button></div>
      <div id="list" class="results-list"></div>
    </section>
  </div>

  <script>
    const FN_URL = "https://ydejsjrjminbyuquywuo.supabase.co/functions/v1/admin-results";
    const FCOLOR = { O: "#8ab4f8", C: "#3182f6", E: "#1b64da", A: "#5b9bf7", N: "#9cc0ff" };
    const FNAME = { O: "개방성", C: "성실성", E: "외향성", A: "우호성", N: "신경성" };
    const FENG = { O: "Openness", C: "Discipline", E: "Extraversion", A: "Empathy", N: "Sensitivity" };
    const ORDER = ["O", "C", "E", "A", "N"];
    const SKEY = "ocean_admin_pw";

    const $ = (id) => document.getElementById(id);

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function timeAgo(iso) {
      const diff = Math.max(0, Date.now() - new Date(iso).getTime());
      const min = Math.floor(diff / 60000);
      if (min < 1) return "방금 전";
      if (min < 60) return min + "분 전";
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + "시간 전";
      const day = Math.floor(hr / 24);
      if (day < 30) return day + "일 전";
      const d = new Date(iso);
      return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0");
    }
    function fullDate(iso) {
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    }
    function levelOf(v) { return v >= 60 ? "높음" : v <= 40 ? "낮음" : "보통"; }

    function detailHtml(r) {
      const s = r.scores || {};
      const bars = ORDER.map((k) => {
        const has = typeof s[k] === "number";
        const v = has ? s[k] : 0;
        return `<div class="d-bar">
          <div class="d-bar-top"><span>${FENG[k]} <em>${FNAME[k]}</em></span><span class="d-bar-val">${has ? v + "% · " + levelOf(v) : "-"}</span></div>
          <div class="d-track"><span style="width:${Math.max(v, 2)}%;background:${FCOLOR[k]}"></span></div>
        </div>`;
      }).join("");
      const ans = Array.isArray(r.answers) && r.answers.length
        ? `<div class="d-ans">${r.answers.map((a, i) => `<span class="d-ans-cell"><b>Q${i + 1}</b>${a == null ? "-" : a}</span>`).join("")}</div>`
        : '<p class="d-none">문항별 응답 데이터가 없습니다.</p>';
      return `<div class="rr-detail" hidden>
        <div class="d-meta">응시 일시 · ${fullDate(r.created_at)}</div>
        <div class="d-section-title">특성별 점수</div>
        ${bars}
        <div class="d-section-title">문항별 응답 (1~5)</div>
        ${ans}
      </div>`;
    }

    function render(rows) {
      $("count").textContent = "총 " + rows.length + "건";
      if (!rows.length) { $("list").innerHTML = '<p class="admin-status">아직 결과가 없어요.</p>'; return; }
      $("list").innerHTML = rows.map((r) => {
        const s = r.scores || {};
        const chips = ORDER.map((k) => `<span class="rr-score"><i style="background:${FCOLOR[k]}"></i>${k} ${typeof s[k] === "number" ? s[k] : "-"}</span>`).join("");
        const t = [r.type_title, r.type_code, r.type_role].filter(Boolean);
        const typeHtml = t.length ? `<div class="rr-type"><strong>${esc(t[0])}</strong>${t.slice(1).map((x) => " · " + esc(x)).join("")}</div>` : "";
        return `<div class="rr-card">
          <div class="rr-top"><span class="rr-nick">${esc(r.nickname || "익명")}</span><span class="rr-date">${timeAgo(r.created_at)}</span></div>
          ${typeHtml}
          <div class="rr-scores">${chips}</div>
          <button class="d-toggle" type="button">자세히 보기</button>
          ${detailHtml(r)}
        </div>`;
      }).join("");
    }

    // 카드 펼치기/접기
    document.getElementById("list").addEventListener("click", (e) => {
      const btn = e.target.closest(".d-toggle");
      if (!btn) return;
      const detail = btn.nextElementSibling;
      if (!detail || !detail.classList.contains("rr-detail")) return;
      if (detail.hasAttribute("hidden")) { detail.removeAttribute("hidden"); btn.textContent = "접기"; }
      else { detail.setAttribute("hidden", ""); btn.textContent = "자세히 보기"; }
    });

    async function fetchResults(pw) {
      let res;
      try {
        res = await fetch(FN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pw }),
        });
      } catch (_) {
        throw new Error("서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.");
      }
      if (res.status === 401) throw new Error("비밀번호가 올바르지 않습니다.");
      if (!res.ok) throw new Error("서버 오류로 불러오지 못했습니다. (" + res.status + ")");
      const data = await res.json();
      return data.results || [];
    }

    async function authed(pw) {
      $("gate").style.display = "none";
      $("panel").style.display = "block";
      $("list").innerHTML = '<p class="admin-status">불러오는 중…</p>';
      try {
        render(await fetchResults(pw));
      } catch (e) {
        // 자동 로그인 실패(비번 만료·서버 정지 등) → 저장된 비번 폐기하고 로그인 화면으로 복귀
        sessionStorage.removeItem(SKEY);
        $("panel").style.display = "none";
        $("gate").style.display = "block";
        $("err").textContent = e.message;
      }
    }

    async function login() {
      const pw = $("pw").value.trim();
      $("err").textContent = "";
      if (!pw) { $("err").textContent = "비밀번호를 입력하세요."; return; }
      $("login").disabled = true; $("login").textContent = "확인 중…";
      try {
        const rows = await fetchResults(pw);
        sessionStorage.setItem(SKEY, pw);
        $("gate").style.display = "none";
        $("panel").style.display = "block";
        render(rows);
      } catch (e) {
        $("err").textContent = e.message;
      } finally {
        $("login").disabled = false; $("login").textContent = "로그인";
      }
    }

    $("login").addEventListener("click", login);
    $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
    $("logout").addEventListener("click", () => { sessionStorage.removeItem(SKEY); location.reload(); });

    // 세션에 저장된 비번이 있으면 자동 로그인
    const saved = sessionStorage.getItem(SKEY);
    if (saved) authed(saved);
  </script>
</body>
</html>
